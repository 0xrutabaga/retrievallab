name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install locked dependencies (no extras, no ML models)
        run: uv sync --locked

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q

      - name: Verify corpus checksums and labels
        run: uv run retrievallab verify

      - name: Regenerate the evaluation report and require it to match the committed one
        run: |
          uv run retrievallab eval
          git diff --exit-code -- reports/

      - name: Audit locked dependencies (including the optional dense extra)
        run: |
          uv export --locked --all-extras --format requirements-txt --no-emit-project -o requirements-audit.txt
          uvx pip-audit --strict --disable-pip -r requirements-audit.txt
