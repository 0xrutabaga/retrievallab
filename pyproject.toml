[project]
name = "retrievallab"
version = "0.1.0"
description = "Reproducible retrieval evaluation harness: chunkers, BM25, TF-IDF, RRF hybrid, IR metrics with bootstrap CIs, over a pinned IETF RFC corpus."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "0xrutabaga" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Optional dense retriever. Not installed by `uv sync`, not used in CI or the default eval.
dense = ["sentence-transformers>=3.0"]

[project.scripts]
retrievallab = "retrievallab.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrievallab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # asserts; seeded PRNG for property-style inputs

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
